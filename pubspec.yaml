name: filekit
description: "Private, on-device image and PDF tools for Android."
publish_to: 'none'

version: 0.2.1+3

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  flutter_riverpod: ^3.5.0
  file_picker: ^13.3.3
  image: ^4.13.1
  pdf: ^3.13.1
  sqflite: ^2.4.6
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.1
  cross_file: ^0.3.5+2
  pdfrx: 2.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  assets:
    - assets/fonts/LICENSE.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

  uses-material-design: true
